name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run tests against PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Start test PostgreSQL database
        run: |
          NETWORK_FLAG=""
          if docker network inspect kind >/dev/null 2>&1; then
            NETWORK_FLAG="--network kind"
          fi
          docker run -d --name pg-test $NETWORK_FLAG -p 5434:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=agent_relay_test postgres:16-alpine
          until docker exec pg-test pg_isready -U postgres -d agent_relay_test; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done

      - name: Run pytest
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if docker network inspect kind >/dev/null 2>&1; then
            PG_HOST="pg-test"
            PG_PORT="5432"
          else
            PG_HOST="localhost"
            PG_PORT="5434"
          fi
          uv sync
          RELAY_DATABASE_URL="postgresql+psycopg://postgres:postgres@${PG_HOST}:${PG_PORT}/agent_relay_test" uv run pytest -v

      - name: Cleanup PostgreSQL
        if: always()
        run: |
          docker rm -f pg-test || true

  deploy:
    name: Build, Load into kind, and Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl and kind
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"

          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then K8S_ARCH="amd64"; elif [ "$ARCH" = "aarch64" ]; then K8S_ARCH="arm64"; else K8S_ARCH="$ARCH"; fi

          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/${K8S_ARCH}/kubectl"
            chmod +x kubectl
            mv kubectl "$HOME/.local/bin/"
          fi

          if ! command -v kind >/dev/null 2>&1; then
            curl -Lo "$HOME/.local/bin/kind" "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-${K8S_ARCH}"
            chmod +x "$HOME/.local/bin/kind"
          fi

      - name: Ensure kind cluster is running
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! kind get clusters | grep -q "^agent-relay$"; then
            echo "Creating kind cluster agent-relay..."
            kind create cluster --name agent-relay
          fi

      - name: Configure kubeconfig
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if kubectl get nodes >/dev/null 2>&1; then
            echo "Default kubeconfig is working."
          else
            echo "Using internal kind kubeconfig for containerized environment..."
            kind get kubeconfig --name agent-relay --internal > /tmp/kubeconfig
            echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV
          fi

      - name: Build Docker image with unique tag
        run: |
          IMAGE_TAG="v-$(date +%s)"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          docker build -t agent-relay:${IMAGE_TAG} .

      - name: Load image into kind cluster
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kind load docker-image agent-relay:${IMAGE_TAG} --name agent-relay

      - name: Deploy to kind cluster and wait for rollout
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl apply -f k8s/app.yaml
          kubectl set image deployment/agent-relay agent-relay=agent-relay:${IMAGE_TAG}
          kubectl rollout status deployment/agent-relay --timeout=120s


